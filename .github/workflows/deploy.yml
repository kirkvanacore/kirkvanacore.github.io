name: Deploy to GitHub Pages

on:
    # Every push to main publishes the site.
    push:
        branches: [main]
    # Weekly rebuild, so events move from "Upcoming" to "Past" on their own.
    schedule:
        - cron: '0 11 * * 1'
    # A "Run workflow" button on the Actions tab.
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; a newer push doesn't cancel one in progress.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - run: npm ci

            - name: Build
              run: npm run build

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
