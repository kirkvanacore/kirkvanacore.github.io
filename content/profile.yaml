short_bio: >-
  Kirk Vanacore is an Assistant Research Professor in the Bowers College of
  Computing and Information Science at Cornell University. His research blends
  statistics, machine learning, and artificial intelligence to uncover causal
  learning mechanisms in environments that combine human and AI instruction.

# Use on the About/Home page.
long_bio:
  - >-
    Kirk Vanacore is the Research Director of the National Tutoring
    Observatory. He integrates statistics, machine learning, and artificial
    intelligence to uncover causal learning mechanisms in environments that
    combine human and AI instruction. He earned his Ph.D. in Learning Sciences
    & Technologies from Worcester Polytechnic Institute. He was a postdoctoral
    fellow at the Penn Center for Learning Analytics at the University of
    Pennsylvania, where he mentored graduate students and conducted research in
    Learning Analytics and Educational Data Mining.
  - >-
    Kirk’s work primarily uses experimental and quasi-experimental
    methods—such as regression discontinuity and propensity score matching—to
    examine how interactions within educational platforms shape learning
    behaviors and outcomes. His recent projects incorporate behavior detection
    model outputs into principal stratification frameworks to explore how
    specific student behaviors moderate learning effects. He also investigates
    the impact of gamification, generative AI feedback, and tutoring
    interventions on student persistence and self-regulated learning.

