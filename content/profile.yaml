# The home page bio, first person (Kirk's text, Nov 2026). One "- >-" item per paragraph.
# The first `bio_shown` paragraphs show; the rest sit behind "Read more" (0 shows all).
# Advisors' names (below, under education and positions) link to their pages automatically;
# to link other phrases, add them under bio_links, e.g.  "National Tutoring Observatory": https://...
bio_shown: 1
long_bio:
  - >-
    I am an Assistant Research Professor in Information Science at Cornell University and the
    Research Director of the National Tutoring Observatory. I am a learning scientist who uses
    computational and causal methods to understand how people learn and to guide how AI in
    education is developed, evaluated, and governed. My research addresses the tension between
    educational technologies’ capacity to support students’ thinking and their potential to
    bypass the cognitive work needed to learn. I study the mechanisms through which these
    technologies affect learning, and the conditions under which they narrow, rather than widen,
    gaps between students with greater and fewer educational resources.
  - >-
    My work combines experimental and quasi-experimental designs with machine learning. I have
    used fully latent principal stratification to examine how students’ tendency to game the
    system shapes the effects of instructional assistance. I have also studied how learners
    using a conversational AI mathematics tutor across sub-Saharan Africa respond to difficulty,
    and combined deep knowledge tracing with causal forests to estimate the effects of
    individual human tutoring sessions. At the National Tutoring Observatory, I lead work on the
    open data, annotation tools, and partnerships needed to connect tutoring interactions to
    evidence of learning. My goal is to make learning and equity central objectives of AI
    development, so that widely available AI instruction benefits the learners whom existing
    systems serve least effectively.
  - >-
    I earned my Ph.D. in Learning Sciences & Technologies from Worcester Polytechnic Institute,
    where I was advised by Adam Sales. I then was a postdoctoral researcher at the Penn Center
    for Learning Analytics at the University of Pennsylvania, working with Ryan Baker, where I
    mentored graduate students and conducted research in learning analytics and educational data
    mining.

